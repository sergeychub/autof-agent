name: Ubuntu Workstation Agent

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WorkstationAgent.Ubuntu/WorkstationAgent.Ubuntu.csproj --configfile WorkstationAgent/NuGet.Config

      - name: Build
        run: dotnet build WorkstationAgent.Ubuntu/WorkstationAgent.Ubuntu.csproj --configuration Release --no-restore

      - name: Publish linux-x64
        run: ./scripts/publish-ubuntu.sh linux-x64 "0.1.${{ github.run_number }}+${{ github.sha }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: workstation-agent-linux-x64
          path: artifacts/publish/linux-x64
          if-no-files-found: error
